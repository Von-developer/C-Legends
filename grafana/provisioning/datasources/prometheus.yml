# ─────────────────────────────────────────────────────────────────────────────
#  Grafana auto-provisioning — Prometheus datasource
#
#  Grafana reads this file on startup and creates the datasource automatically.
#  No manual "Add data source" step in the UI is needed.
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: 1

datasources:
  - name:      C-Legends Prometheus
    type:      prometheus
    uid:       clegends-prometheus
    access:    proxy
    # "prometheus" resolves to the Prometheus container via Docker bridge network
    url:       http://prometheus:9090
    isDefault: true
    editable:  false
    jsonData:
      httpMethod:       POST
      timeInterval:     5s
      # Enables the Prometheus exemplars feature (useful for tracing later)
      exemplarTraceIdDestinations: []
