# ─────────────────────────────────────────────────────────────────────────────
#  C-Legends  —  Docker Compose stack
#
#  Two containers:
#    1. clegends-engine  — C++ log analyser (exposes /metrics on :9091)
#    2. prometheus       — Scrapes the engine every 5 s
#
#  Quick start:
#    docker compose up --build
#
#  Optional geo lookups:
#    Download GeoLite2-City.mmdb and place it in this directory.
#    It will be mounted into the engine container automatically.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  clegends-net:
    driver: bridge

volumes:
  prometheus-data:

services:

  # ── Container 1: C++ Log Analysis Engine ─────────────────────────────────
  clegends-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clegends-engine
    restart: unless-stopped
    networks:
      - clegends-net
    ports:
      - "9091:9091"
    volumes:
      - ./logs:/app/logs:ro
      - ./Mac.log:/app/Mac.log          # live log file — append to this on the host
      - ./GeoLite2-City.mmdb:/app/GeoLite2-City.mmdb:ro   # MaxMind geo DB (permanent)
    environment:
      - LOG_FILE=Mac.log
    stdin_open: true
    tty: false
    healthcheck:
      # Pure bash TCP check — no curl/wget needed in the container
      test: ["CMD-SHELL", "bash -c 'echo -e \"GET /metrics HTTP/1.0\\r\\n\" > /dev/tcp/localhost/9091' 2>/dev/null || exit 1"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s

  # ── Container 2: Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: clegends-prometheus
    restart: unless-stopped
    networks:
      - clegends-net
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux compatibility for host.docker.internal
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      clegends-engine:
        condition: service_healthy
